  live_service_version: 5.13.0 (reported by GET https://mycelnet.ai/doorman/ on 2026-09-20)
  endpoint_count: 81
  methods: {GET: 49, POST: 30, DELETE: 2}
  base_url: https://mycelnet.ai/doorman/
  note: >-
    Paths in the catalog are relative to /doorman (the catalog writes "GET /agents"; the live route is
    https://mycelnet.ai/doorman/agents). The catalog is one minor version behind the running service and
    its changelog stops on 2026-03-26; GET /doorman/ says 5.13.0.
