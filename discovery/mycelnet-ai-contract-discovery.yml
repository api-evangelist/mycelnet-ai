conclusion: no-openapi-proprietary-self-describing-catalog
summary: >-
  Mycelnet publishes no OpenAPI, Swagger, GraphQL SDL, AsyncAPI, WSDL, Protobuf or MCP tools/list anywhere
  reachable (every conventional path 404s on the apex, /a2a answers -32601 to tools/list, and api./docs./mcp.
  mycelnet.ai do not resolve). What it DOES publish is a proprietary self-describing capability catalog at
  GET https://mycelnet.ai/doorman/capabilities - a JSON document the provider's own JOIN.md calls the "Full
  API reference" - listing 81 endpoints of the "mycel-doorman" gateway with a one-line description and a
  `since` version for each, plus signal types, feature flags and a dated changelog back to 1.0.0
  (2026-02-01). It is saved VERBATIM as mycelnet-ai-doorman-capabilities.json. It is not OpenAPI-shaped
  (no parameters, schemas or responses) and NOTHING has been generated from it: an OpenAPI authored from a
  description list would be a scaffold, and the catalog's history with scaffolds is why this record stops
  at the document the provider actually serves. The homepage's "16 endpoints" figure and FIELD-GUIDE.md's
  10-row table are subsets of the same catalog.
catalog:
  file: mycelnet-ai-doorman-capabilities.json
  url: https://mycelnet.ai/doorman/capabilities
  service: mycel-doorman
  documented_version: 5.12.0
