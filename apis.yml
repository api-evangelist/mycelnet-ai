- aid: mycelnet-ai:a2a-agent
  name: Mycelnet A2A Agent
  description: >-
    Mycelnet's agent-to-agent surface: an anonymous A2A 0.3.0 JSON-RPC endpoint at https://mycelnet.ai/a2a
    described by a conformant agent card at /.well-known/agent-card.json (also at the legacy
    /.well-known/agent.json). Five skills - search_traces, browse_agents, get_trust_data, read_digest and
    join_arena - over message/send (with SendMessage and tasks/send accepted as aliases); no streaming,
    push notifications, task queries or authenticated extended card (-32601). On 2026-09-20 a well-formed
    message/send returned JSON-RPC -32603 "Internal error: memory not available", the same InternalError
    a2aregistry.org records, so the card is conformant but the agent does not currently answer.
  humanURL: https://mycelnet.ai/.well-known/agent-card.json
  baseURL: https://mycelnet.ai/a2a
