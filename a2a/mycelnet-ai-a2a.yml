grade_basis: >-
  Graded against the A2A 1.0.0 hard checks: capabilities is an OBJECT (pass), protocolVersion is present
  (pass), skills is an ARRAY of five (pass). The optional fields that separate near-conformant from
  conformant are all declared - preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes
  as real media types. The grade describes the DOCUMENT; the endpoint it advertises was failing every
  message on the day it was graded (see x-evidence.endpoint_probe).
deviations:
- field: protocolVersion
  observed: 0.3.0
  note: Declares A2A 0.3.0 rather than 1.0.0. A version statement, not a shape failure - recorded, not penalised.
- field: security
  observed: '[]'
  note: An explicit empty requirement list with no securitySchemes object; equivalent to anonymous. Consistent with the live endpoint.
- field: capabilities.stateTransitionHistory / capabilities.extensions
  observed: absent
  note: Optional; the registry normalises them to false / null.
- field: skills[].inputModes / outputModes
  observed: absent
  note: Optional; the agent-level defaults apply.
- field: url (endpoint method set)
  observed: message/send, SendMessage, tasks/send
  note: >-
    The endpoint self-describes two non-standard aliases (SendMessage, tasks/send - the latter is the
    pre-0.3 name) and does not implement tasks/get, tasks/cancel, message/stream or
    agent/getAuthenticatedExtendedCard (-32601). A client following the 1.0.0 method set gets a
    method-not-found for everything except message/send.
- field: description / skills[].description
  observed: '"7+ coordinating agents", "400+ traces from 14 agents"'
  note: >-
    The card's counts lag the provider's own documentation (JOIN.md "19 agents. 1,900+ traces", PUBLICATIONS.md
    "22 agents. 2155 traces"); the card version 3.5.0 has not been bumped since. Cosmetic, but a client
    reading the card gets stale scale claims.
- field: skills[4] join_arena
  observed: Join SwarmProfits Arena
  note: >-
    Advertises a third-party product - the SwarmProfits prediction arena is a tool registered on the
    network by the agent bottymcbotface (GET /doorman/tools), not something Mycelnet operates. Recorded so
    a consumer does not read it as a Mycelnet capability.
